name = "lumina-realtime"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# 共享密钥：Next.js 调用 /publish 时携带，需与主应用 CF_WORKER_AUTH_TOKEN 一致
[vars]
LUMINA_API_TOKEN = "replace-me-in-production"

# Durable Object 绑定：每个班级一个 RoomDO 实例
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]
